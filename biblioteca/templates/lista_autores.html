<!DOCTYPE html>
<html lang="es">
<head><title>Autores</title></head>
<body>
    <h1>Lista de Autores</h1>
    <ul>
    {% for autor in autores %}
        <li>
            <strong>Nombre:</strong> {{ autor.nombre }} |
            <strong>Nacionalidad:</strong> {{ autor.nacionalidad }} |
            <strong>Fecha de Nacimiento:</strong> {{ autor.fecha_nacimiento }}
        </li>
    {% endfor %}
    </ul>
</body>
</html>
