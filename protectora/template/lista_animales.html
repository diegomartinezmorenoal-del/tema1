<!DOCTYPE html>
<html lang="es">
<head><title>Lista de Animales</title></head>
<body>
    <h1>Lista de Animales</h1>
    <ul>
    {% for animal in animales %}
        <li>
            <strong>Nombre:</strong> {{ animal.nombre }} |
            <strong>Tipo:</strong> {{ animal.tipo }} |
            <strong>Cuidador:</strong> {{ animal.cuidador.username }}
        </li>
    {% endfor %}
    </ul>
</body>
</html>
